<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雨夜便利店</title>
<meta name="description" content="三渲二风格的雨夜日式便利店街角微缩模型，可拖拽旋转、缩放观看。">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #090d1c; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .fail { position: fixed; inset: 0; display: grid; place-items: center; color: #c9d3f0; font: 15px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* =====================================================================
   雨夜便利店街角 · 三渲二微缩模型
   - 所有几何体由代码生成，无外部模型
   - 卡通着色（3 档明暗）+ 深度/法线边缘检测描边（后期处理）
   - 湿地面：镜像相机实时反射 + 竖向拉丝模糊 + 积水遮罩 + 涟漪扰动
   - 店内点光源与路灯投射阴影，光只从玻璃透出
   - 后期：描边合成 → 泛光（Bloom）→ 移轴景深 + 色散 + 调色 + 胶片颗粒
   - 雨丝与水花按附近光源实时着色
   ===================================================================== */
(function () {
  "use strict";

  function fail() {
    document.body.innerHTML = '<div class="fail">这个场景需要 WebGL。<br>请换用支持 WebGL 的浏览器，或开启硬件加速后再试。</div>';
  }
  if (!window.THREE || !THREE.OrbitControls || !THREE.UnrealBloomPass) { fail(); return; }

  var COARSE = matchMedia("(pointer: coarse)").matches;
  var LOW = COARSE || Math.min(innerWidth, innerHeight) < 640;
  var REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FX = 1;            // 不参与描边的图层：雨、玻璃、光晕、反光
  var WET = 2;           // 湿地面反射层：只在主画面渲染，不进镜像
  var SW = 0.12;         // 人行道高度
  var FL = 0.14;         // 店内地面高度
  var HALF = 7.1;        // 底座半宽

  /* ---------- 渲染器 ---------- */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  } catch (e) { fail(); return; }
  var DPR = LOW ? Math.min(window.devicePixelRatio || 1, 2) : 2;   // 桌面端固定 2 倍超采样
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.autoClear = false;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x161c38, 40, 95);

  var camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 140);
  camera.layers.enable(FX);
  function placeCamera() {
    var aspect = innerWidth / innerHeight;
    var k = Math.max(1, 1.25 / aspect);
    camera.position.set(22 * k, 16.5 * k, 24 * k);
  }
  placeCamera();

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(-0.3, 1.5, -0.2);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 9;
  controls.maxDistance = 70;
  controls.minPolarAngle = 0.18;
  controls.maxPolarAngle = 1.42;
  controls.panSpeed = 0.6;
  controls.autoRotate = !REDUCE;
  controls.autoRotateSpeed = 0.3;
  var idleSince = 0;
  controls.addEventListener("start", function () { controls.autoRotate = false; idleSince = -1; });
  controls.addEventListener("end", function () { idleSince = clockTime; });

  /* ---------- 工具 ---------- */
  var seed = 20261030;
  function R() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function V(x, y, z) { return new THREE.Vector3(x, y, z); }

  var gradMap = new THREE.DataTexture(new Uint8Array([72, 72, 72, 255, 150, 150, 150, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
  gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter;
  gradMap.generateMipmaps = false;
  gradMap.needsUpdate = true;

  var matCache = {};
  function toon(color, opt) {
    if (!opt) {
      if (!matCache[color]) matCache[color] = new THREE.MeshToonMaterial({ color: color, gradientMap: gradMap });
      return matCache[color];
    }
    return new THREE.MeshToonMaterial(Object.assign({ color: color, gradientMap: gradMap }, opt));
  }
  var warmCache = {};
  function warm(color, k) { // 店内：自带一点暖色自发光，显得明亮
    var key = color + ":" + (k || 0.3);
    if (!warmCache[key]) warmCache[key] = toon(color, { emissive: new THREE.Color(color).multiplyScalar(k || 0.3) });
    return warmCache[key];
  }
  function basic(color, opt) { return new THREE.MeshBasicMaterial(Object.assign({ color: color }, opt || {})); }
  function M(m) { return typeof m === "number" ? toon(m) : m; }

  var BOX = new THREE.BoxGeometry(1, 1, 1);
  function boxB(w, h, d, mat, x, y, z, parent, noShadow) {
    var m = new THREE.Mesh(BOX, M(mat));
    m.scale.set(w, h, d);
    m.position.set(x, y + h / 2, z);
    m.castShadow = !noShadow;
    m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  function cyl(rt, rb, h, mat, x, y, z, seg, parent) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 12), M(mat));
    m.position.set(x, y + h / 2, z);
    m.castShadow = true; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  var UP = V(0, 1, 0);
  function rod(a, b, r, mat, parent, seg) {
    var dir = new THREE.Vector3().subVectors(b, a);
    var len = dir.length();
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg || 8), M(mat));
    m.position.copy(a).addScaledVector(dir, 0.5);
    m.quaternion.setFromUnitVectors(UP, dir.normalize());
    m.castShadow = true;
    (parent || scene).add(m);
    return m;
  }
  function plane(w, h, mat, x, y, z, ry, rx, parent) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    m.rotation.set(rx || 0, ry || 0, 0, "YXZ");
    m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  function ground(w, d, mat, x, y, z, ry) { return plane(w, d, mat, x, y, z, ry || 0, -Math.PI / 2); }
  function fx(o) { o.traverse(function (c) { c.layers.set(FX); }); return o; }

  /* ---------- 画布贴图 ---------- */
  var JP = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo","PingFang SC",sans-serif';
  var ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  function ctex(w, h, draw, rep) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    draw(g, w, h);
    var t = new THREE.CanvasTexture(c);
    t.anisotropy = ANISO;
    if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
    return t;
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function text(g, s, x, y, size, color, weight, align) {
    g.font = (weight || 800) + " " + size + "px " + JP;
    g.fillStyle = color;
    g.textAlign = align || "center";
    g.textBaseline = "middle";
    g.fillText(s, x, y);
  }
  function lines(g, x, y, w, n, color, gap) { // 假文字行
    g.fillStyle = color;
    for (var i = 0; i < n; i++) g.fillRect(x, y + i * (gap || 9), w * (0.55 + 0.45 * ((i * 37) % 10) / 10), 4);
  }
  var POP = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#ff9f45", "#f4f4f4", "#c77dff", "#2ec4b6", "#e63946", "#ffb5a7", "#90e0ef", "#f7b801"];
  function pop() { return POP[Math.floor(R() * POP.length)]; }

  function speckle(g, w, h, n, colors) {
    for (var i = 0; i < n; i++) {
      g.fillStyle = colors[i % colors.length];
      g.fillRect(R() * w, R() * h, 1 + R() * 2, 1 + R() * 2);
    }
  }
  var asphaltTex = ctex(512, 512, function (g, w, h) {
    g.fillStyle = "#30364a"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 5000, ["rgba(255,255,255,0.05)", "rgba(0,0,0,0.18)", "rgba(120,140,200,0.08)"]);
  }, [4, 4]);
  function sidewalkTex(rx, ry) {
    return ctex(256, 256, function (g, w, h) {
      g.fillStyle = "#5d637b"; g.fillRect(0, 0, w, h);
      speckle(g, w, h, 900, ["rgba(255,255,255,0.05)", "rgba(0,0,0,0.12)"]);
      g.strokeStyle = "#474c61"; g.lineWidth = 3;
      for (var y = 0; y <= h; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      for (var r = 0; r < 4; r++) for (var x = 0; x <= w; x += 64) {
        var ox = (r % 2) * 32;
        g.beginPath(); g.moveTo(x + ox, r * 64); g.lineTo(x + ox, r * 64 + 64); g.stroke();
      }
    }, [rx, ry]);
  }
  var floorTex = ctex(256, 256, function (g, w, h) {
    g.fillStyle = "#efe8da"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#d6ccb8"; g.lineWidth = 3;
    for (var i = 0; i <= w; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
  }, [6, 6]);
  var concreteTex = ctex(256, 256, function (g, w, h) {
    g.fillStyle = "#4b5064"; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 1500, ["rgba(255,255,255,0.05)", "rgba(0,0,0,0.15)"]);
  }, [3, 3]);

  function umbrellaIcon(g, cx, cy, r, color) {
    g.fillStyle = color;
    g.beginPath(); g.arc(cx, cy, r, Math.PI, 0); g.closePath(); g.fill();
    g.fillRect(cx - r * 0.06, cy, r * 0.12, r * 0.9);
    g.strokeStyle = color; g.lineWidth = r * 0.12;
    g.beginPath(); g.arc(cx - r * 0.18, cy + r * 0.9, r * 0.18, 0, Math.PI); g.stroke();
  }

  var signTex = ctex(1024, 128, function (g, w, h) {
    g.fillStyle = "#fbfbf5"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#ff8a2a"; g.fillRect(0, 0, w, 8);
    g.fillStyle = "#1fa37a"; g.fillRect(0, h - 28, w, 12);
    g.fillStyle = "#2b6fd6"; g.fillRect(0, h - 14, w, 14);
    umbrellaIcon(g, 110, 54, 34, "#2b6fd6");
    text(g, "あまやどり", 175, 56, 62, "#1d2a5a", 900, "left");
    text(g, "AMAYADORI MART", 520, 64, 22, "#2b6fd6", 800, "left");
    g.fillStyle = "#ff8a2a"; rr(g, w - 196, 20, 156, 70, 14); g.fill();
    text(g, "24h", w - 118, 56, 50, "#ffffff", 900);
  });
  var pylonTex = ctex(256, 320, function (g, w, h) {
    g.fillStyle = "#fbfbf5"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#e2453c"; g.fillRect(0, 0, w, 150);
    text(g, "24", w / 2, 70, 118, "#ffffff", 900);
    text(g, "HOURS", w / 2, 132, 24, "#ffe2dc", 800);
    umbrellaIcon(g, w / 2, 182, 22, "#2b6fd6");
    text(g, "あまやどり", w / 2, 240, 40, "#1d2a5a", 900);
    g.fillStyle = "#1fa37a"; g.fillRect(0, h - 34, w, 14);
    g.fillStyle = "#2b6fd6"; g.fillRect(0, h - 20, w, 20);
  });
  function vendingTex(hotRow, bg) {
    return ctex(256, 400, function (g, w, h) {
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      for (var r = 0; r < 3; r++) {
        var y = 16 + r * 126;
        g.fillStyle = "rgba(20,40,80,0.08)"; g.fillRect(8, y - 4, w - 16, 88);
        for (var c = 0; c < 6; c++) {
          var x = 16 + c * 38;
          g.fillStyle = pop(); rr(g, x, y + 6, 28, 72, 8); g.fill();
          g.fillStyle = "rgba(255,255,255,0.75)"; g.fillRect(x + 4, y + 12, 5, 56);
          g.fillStyle = "rgba(255,255,255,0.9)"; g.fillRect(x + 2, y + 34, 24, 10);
        }
        var hot = r === hotRow;
        g.fillStyle = hot ? "#e0383e" : "#2c6fd8"; g.fillRect(8, y + 86, w - 16, 18);
        text(g, hot ? "あったか〜い" : "つめた〜い", w / 2, y + 95, 13, "#ffffff", 800);
        for (var b = 0; b < 6; b++) { g.fillStyle = "#3ee07a"; g.fillRect(22 + b * 38, y + 108, 16, 6); }
      }
    });
  }
  var fridgeTex = ctex(1024, 512, function (g, w, h) {
    g.fillStyle = "#fff8ea"; g.fillRect(0, 0, w, h);
    for (var d = 0; d < 5; d++) {
      var x0 = d * 204 + 4;
      for (var s = 0; s < 5; s++) {
        var y = 22 + s * 96;
        g.fillStyle = "#d9d0bd"; g.fillRect(x0, y + 80, 196, 6);
        for (var k = 0; k < 8; k++) {
          var bx = x0 + 10 + k * 23, bh = 52 + R() * 22;
          g.fillStyle = pop(); rr(g, bx, y + 80 - bh, 18, bh, 6); g.fill();
          g.fillStyle = "rgba(255,255,255,0.85)"; g.fillRect(bx + 2, y + 80 - bh * 0.6, 14, 10);
          g.fillStyle = "#444"; g.fillRect(bx + 5, y + 80 - bh - 5, 8, 6);
        }
      }
      g.strokeStyle = "#5a6170"; g.lineWidth = 10; g.strokeRect(x0, 4, 196, h - 8);
      g.fillStyle = "#a6afc0"; g.fillRect(x0 + 176, 180, 8, 140);
    }
  });
  function bannerTex(str, bg, fg, w, h, size) {
    return ctex(w || 512, h || 64, function (g, W, H) {
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      text(g, str, W / 2, H / 2 + 2, size || 34, fg || "#ffffff", 900);
    });
  }
  function posterTex(kind) {
    return ctex(200, 280, function (g, w, h) {
      if (kind === "rain") {
        g.fillStyle = "#3f7fd9"; g.fillRect(0, 0, w, h);
        umbrellaIcon(g, w / 2, 100, 52, "#ffffff");
        text(g, "雨の日セール", w / 2, 190, 28, "#ffffff", 900);
        text(g, "ビニール傘 500円", w / 2, 232, 18, "#ffe066", 800);
      } else if (kind === "oden") {
        g.fillStyle = "#ffd34d"; g.fillRect(0, 0, w, h);
        text(g, "おでん", w / 2, 70, 56, "#d6332e", 900);
        g.fillStyle = "#fff"; g.beginPath(); g.ellipse(60, 150, 26, 34, 0, 0, 7); g.fill();
        g.fillStyle = "#f2d6a0"; g.beginPath(); g.arc(130, 150, 30, 0, 7); g.fill();
        text(g, "全品 70円", w / 2, 230, 32, "#1d2a5a", 900);
      } else if (kind === "karaage") {
        g.fillStyle = "#e8473f"; g.fillRect(0, 0, w, h);
        g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(150, 46, 34, 0, 7); g.fill();
        text(g, "新発売", 150, 46, 20, "#d6332e", 900);
        g.fillStyle = "#c9782f"; for (var i = 0; i < 4; i++) { g.beginPath(); g.arc(50 + i * 34, 140, 22, 0, 7); g.fill(); }
        text(g, "からあげ", w / 2, 220, 42, "#ffffff", 900);
      } else if (kind === "baito") {
        g.fillStyle = "#2fae6e"; g.fillRect(0, 0, w, h);
        text(g, "アルバイト", w / 2, 70, 32, "#ffffff", 900);
        text(g, "募集中", w / 2, 116, 40, "#ffe066", 900);
        lines(g, 30, 160, 140, 6, "rgba(255,255,255,0.8)", 14);
      } else {
        g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
        g.fillStyle = "#f4f4f4"; g.strokeStyle = "#ddd";
        g.beginPath(); g.moveTo(100, 40); g.lineTo(160, 140); g.lineTo(40, 140); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = "#1e2a24"; g.fillRect(75, 108, 50, 32);
        text(g, "おにぎり", w / 2, 190, 36, "#1d2a5a", 900);
        text(g, "100円〜", w / 2, 236, 30, "#e2453c", 900);
      }
    });
  }
  var bulletinTex = ctex(320, 200, function (g, w, h) {
    g.fillStyle = "#3d6b4f"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#f4f1e8"; g.fillRect(0, 0, w, 30);
    text(g, "町内会のお知らせ", w / 2, 16, 18, "#1d2a5a", 900);
    var papers = [
      [18, 42, 88, 120, "#fff7e0", "防災訓練"],
      [116, 46, 90, 70, "#ffffff", "ゴミの日"],
      [116, 124, 90, 64, "#e8f4ff", "回覧板"],
      [216, 40, 88, 140, "#ffe9ec", "迷い猫"]
    ];
    papers.forEach(function (p, i) {
      g.save(); g.translate(p[0] + p[2] / 2, p[1] + p[3] / 2); g.rotate((i % 2 ? 1 : -1) * 0.03);
      g.fillStyle = p[4]; g.fillRect(-p[2] / 2, -p[3] / 2, p[2], p[3]);
      text(g, p[5], 0, -p[3] / 2 + 14, 14, "#d6332e", 900);
      if (p[5] === "迷い猫") {
        g.fillStyle = "#333"; g.beginPath(); g.arc(0, 0, 18, 0, 7); g.fill();
        g.beginPath(); g.moveTo(-16, -8); g.lineTo(-10, -26); g.lineTo(-2, -12); g.fill();
        g.beginPath(); g.moveTo(16, -8); g.lineTo(10, -26); g.lineTo(2, -12); g.fill();
        lines(g, -34, 30, 68, 3, "#888", 9);
      } else lines(g, -p[2] / 2 + 8, -p[3] / 2 + 30, p[2] - 16, Math.floor((p[3] - 36) / 10), "#888", 10);
      g.fillStyle = "#e2453c"; g.beginPath(); g.arc(0, -p[3] / 2 + 3, 3, 0, 7); g.fill();
      g.restore();
    });
  });
  var shutterTex = ctex(256, 256, function (g, w, h) {
    g.fillStyle = "#9aa0ab"; g.fillRect(0, 0, w, h);
    for (var y = 0; y < h; y += 8) { g.fillStyle = "#7f8592"; g.fillRect(0, y, w, 2); g.fillStyle = "#b6bcc6"; g.fillRect(0, y + 3, w, 1); }
    g.fillStyle = "#6c717c"; g.fillRect(w / 2 - 30, h - 18, 60, 8);
    g.fillStyle = "#ffffff"; g.fillRect(150, 90, 70, 50);
    text(g, "本日休業", 185, 104, 14, "#d6332e", 900);
    lines(g, 158, 120, 54, 2, "#999", 8);
  });
  var curtainTex = ctex(128, 128, function (g, w, h) {
    var gr = g.createRadialGradient(64, 64, 6, 64, 64, 80);
    gr.addColorStop(0, "#ffe2a8"); gr.addColorStop(1, "#f0a65e");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 4; i++) {
      g.fillStyle = "rgba(170,90,40,0.35)"; g.fillRect(4 + i * 9, 0, 4, h); g.fillRect(w - 8 - i * 9, 0, 4, h);
    }
    g.fillStyle = "#3a3330"; g.fillRect(w / 2 - 3, 0, 6, h); g.fillRect(0, h / 2 - 3, w, 6);
  });
  var stopTex = ctex(256, 256, function (g) {
    g.fillStyle = "#ffffff";
    g.beginPath(); g.moveTo(12, 24); g.lineTo(244, 24); g.lineTo(128, 238); g.closePath(); g.fill();
    g.fillStyle = "#d8282f";
    g.beginPath(); g.moveTo(34, 36); g.lineTo(222, 36); g.lineTo(128, 212); g.closePath(); g.fill();
    text(g, "止まれ", 128, 92, 54, "#ffffff", 900);
  });
  var tomareTex = ctex(512, 256, function (g, w, h) {
    g.save(); g.translate(w / 2, h / 2); g.scale(1, 1.55);
    text(g, "止まれ", 0, 6, 150, "#e4e8f0", 900);
    g.restore();
  });
  var oneWayTex = ctex(256, 96, function (g, w, h) {
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);

      "  vec3 c0 = n0.xyz * 2.0 - 1.0;",

      "  float normalEdge = smoothstep(0.28, 0.6, ne) * n0.a * n1.a * n2.a * n3.a * n4.a * (1.0 - smoothstep(32.0, 60.0, dist));",
      "  float edge = clamp(max(depthEdge, normalEdge), 0.0, 1.0) * (1.0 - smoothstep(50.0, 90.0, dist));",
      "  vec3 col = texture2D(tColor, vUv).rgb;",
      "  vec2 q = vUv - vec2(0.5, 0.56);",
      "  vec3 bg = mix(vec3(0.03, 0.04, 0.085), vec3(0.085, 0.10, 0.20), vUv.y) + vec3(0.07, 0.08, 0.16) * exp(-dot(q, q) * 5.0);",
      "  vec3 base = raw > 0.99999 ? bg + col : col;",
      "  base = mix(base, vec3(0.055, 0.06, 0.13), edge * 0.9);",
      "  float vig = smoothstep(1.2, 0.35, length((vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0)));",
      "  base *= mix(0.74, 1.0, vig);",
      "  gl_FragColor = vec4(base, 1.0);",
      "}"
    ].join("\n"),
    depthTest: false, depthWrite: false
  });
  var postScene = new THREE.Scene();
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
  var postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  // 最终：移轴景深 + 色散 + 调色 + 胶片颗粒
  var finalMat = new THREE.ShaderMaterial({
    uniforms: {
      tIn: { value: null }, tDepth: { value: null }, uRes: { value: new THREE.Vector2(1, 1) },
      uNear: { value: camera.near }, uFar: { value: camera.far }, uFocus: { value: 30 }, uTime: { value: 0 }, uBlur: { value: 7.0 * DPR }
    },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
    fragmentShader: [
      "#include <packing>",
      "uniform sampler2D tIn, tDepth; uniform vec2 uRes; uniform float uNear, uFar, uFocus, uTime, uBlur; varying vec2 vUv;",
      "float lin(vec2 uv){ return -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, uNear, uFar); }",
      "float coc(vec2 uv){ float d = min(lin(uv), uFocus * 2.5); float c = clamp(abs(d - uFocus) / uFocus * 2.4 - 0.1, 0.0, 1.0); float tilt = smoothstep(0.18, 0.5, abs(uv.y - 0.48)); return clamp(max(c, tilt * 0.85), 0.0, 1.0); }",
      "float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }",
      "void main(){",
      "  float c0 = coc(vUv);",
      "  vec2 dir = vUv - 0.5; float ca = dot(dir, dir) * 0.012;",
      "  vec3 sharp = vec3(texture2D(tIn, vUv + dir * ca).r, texture2D(tIn, vUv).g, texture2D(tIn, vUv - dir * ca).b);",
      "  vec3 acc = sharp; float ws = 1.0;",
      "  float ang = hash(vUv * uRes) * 6.2831;",
      "  for (int i = 1; i < 28; i++){",
      "    float fi = float(i); float r = sqrt(fi / 27.0) * uBlur * c0; ang += 2.39996;",
      "    vec2 o = vec2(cos(ang), sin(ang)) * r / uRes;",
      "    float cs = coc(vUv + o);",
      "    float w = smoothstep(0.0, 0.35, cs);",
      "    acc += texture2D(tIn, vUv + o).rgb * w; ws += w;",
      "  }",
      "  vec3 col = mix(sharp, acc / ws, smoothstep(0.02, 0.25, c0));",
      "  float l = dot(col, vec3(0.299, 0.587, 0.114));",
      "  col += vec3(-0.01, 0.012, 0.045) * (1.0 - l) + vec3(0.035, 0.012, -0.02) * l;",
      "  col = mix(vec3(l), col, 1.08);",
      "  col += (hash(vUv * uRes + fract(uTime) * 91.7) - 0.5) * 0.03;",
      "  gl_FragColor = vec4(col, 1.0);",
      "}"
    ].join("\n"),
    depthTest: false, depthWrite: false
  });
  var finalScene = new THREE.Scene();
  finalScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), finalMat));
  var rtComp = null;
  var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), LOW ? 0.45 : 0.55, 0.45, 0.84);

  function makeTargets() {
    var w = Math.max(1, Math.floor(innerWidth * DPR)), h = Math.max(1, Math.floor(innerHeight * DPR));
    if (rtColor) { rtColor.dispose(); rtColor.depthTexture.dispose(); rtNormal.dispose(); rtRefl.dispose(); rtComp.dispose(); }
    rtRefl = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    rtComp = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    wetMat.uniforms.tRefl.value = rtRefl.texture;
    finalMat.uniforms.tIn.value = rtComp.texture;
    finalMat.uniforms.uRes.value.set(w, h);
    bloom.setSize(w, h);
    rtColor = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
    rtColor.depthTexture = new THREE.DepthTexture(w, h);
    rtColor.depthTexture.type = THREE.UnsignedIntType;
    rtNormal = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
    post.uniforms.tColor.value = rtColor.texture;
    post.uniforms.tDepth.value = rtColor.depthTexture;
    post.uniforms.tNormal.value = rtNormal.texture;
    post.uniforms.uRes.value.set(w, h);
    finalMat.uniforms.tDepth.value = rtColor.depthTexture;
  }
  makeTargets();

  function render() {
    camera.layers.set(0);
    scene.overrideMaterial = normalMat;
    renderer.setRenderTarget(rtNormal);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);

    scene.overrideMaterial = null;
    renderer.shadowMap.needsUpdate = true;
    updateMirror();
    renderer.setRenderTarget(rtRefl);
    renderer.setClearColor(0x0a0f22, 1);
    renderer.clear();
    renderer.render(scene, mirrorCam);

    camera.layers.enable(FX);
    camera.layers.enable(WET);
    renderer.setRenderTarget(rtColor);
    renderer.setClearColor(0x000000, 1);
    renderer.clear();
    renderer.render(scene, camera);

    renderer.setRenderTarget(rtComp);
    renderer.clear();
    renderer.render(postScene, postCam);
    bloom.render(renderer, null, rtComp, 0.016, false);

    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(finalScene, finalCam);
  }
  var finalCam = postCam;

  /* ---------- 动画 ---------- */
  function smooth(t) { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); }
  var clockTime = 0;
  var flickAt = 3, flickEnd = 0, pyFlickAt = 7, pyFlickEnd = 0;
  var dir = new THREE.Vector3();

  function setLamp(heads, on) {
    ["g", "y", "r"].forEach(function (k) {
      heads[k].mesh.material.color.setHex(k === on ? lampColors[k] : 0x1d2028);
    });
  }

  function update(t, dt) {
    var i, k;
    glassMats.forEach(function (m) { m.uniforms.uTime.value = t; });
    streaks.forEach(function (s) {
      s.material.uniforms.uTime.value = t;
      dir.set(camera.position.x - s.position.x, 0, camera.position.z - s.position.z).normalize();
      s.rotation.y = Math.atan2(dir.x, dir.z);
      var tx = dir.x > 0 ? (HALF - s.position.x) / dir.x : dir.x < 0 ? (-HALF - s.position.x) / dir.x : 1e9;
      var tz = dir.z > 0 ? (HALF - s.position.z) / dir.z : dir.z < 0 ? (-HALF - s.position.z) / dir.z : 1e9;
      s.scale.set(s.userData.width, 1, Math.max(0.01, Math.min(s.userData.maxLen, tx - 0.05, tz - 0.05)));
    });

    // 雨
    for (i = 0; i < RAIN; i++) {
      ry[i] -= rv[i] * dt;
      rx[i] += WIND_X * dt * 0.08; rz[i] += WIND_Z * dt * 0.08;
      if (ry[i] <= rf[i]) {
        if (rf[i] < 0.2) {
          if (R() < 0.12) ripple(rx[i], rf[i], rz[i]);
          if (R() < 0.35) splash(rx[i], rf[i], rz[i]);
        }
        dropReset(i, true);
      }
      var o = i * 6;
      rainPos[o] = rx[i]; rainPos[o + 1] = ry[i]; rainPos[o + 2] = rz[i];
      rainPos[o + 3] = rx[i] - 0.05 * rl[i]; rainPos[o + 4] = ry[i] + rl[i]; rainPos[o + 5] = rz[i] - 0.025 * rl[i];
    }
    rainGeo.attributes.position.needsUpdate = true;
    for (i = 0; i < SPL; i++) {
      if (spL[i] > 0) {
        spL[i] -= dt; spVY[i] -= 9.8 * dt;
        spX[i] += spVX[i] * dt; spY[i] += spVY[i] * dt; spZ[i] += spVZ[i] * dt;
        spPos[i * 3] = spX[i]; spPos[i * 3 + 1] = spY[i]; spPos[i * 3 + 2] = spZ[i];
        spLife[i] = Math.max(0, spL[i] / 0.3);
      } else spLife[i] = 0;
    }
    spGeo.attributes.position.needsUpdate = true; spGeo.attributes.aLife.needsUpdate = true;
    wetMat.uniforms.uTime.value = t;
    finalMat.uniforms.uTime.value = t;
    finalMat.uniforms.uFocus.value = camera.position.distanceTo(controls.target);

    // 积水里持续的涟漪
    if (R() < dt * 14) {
      var p = puddles[Math.floor(R() * puddles.length)];
      var a = R() * Math.PI * 2, r = Math.sqrt(R()) * 0.8;
      ripple(p[0] + Math.cos(a) * r * p[3], p[1], p[2] + Math.sin(a) * r * p[4], 0.18 + R() * 0.2);
    }
    for (i = 0; i < RIP; i++) if (ripAge[i] < 1) ripAge[i] = Math.min(1, ripAge[i] + dt / 0.85);
    ageAttr.needsUpdate = true; sizeAttr.needsUpdate = true;

    // 屋檐滴水
    drips.forEach(function (d) {
      d.t += dt;
      if (d.t < 0) { d.mesh.visible = false; return; }
      if (d.t < d.wait) { // 在檐口慢慢鼓起
        d.mesh.visible = true;
        d.mesh.position.set(d.x, 2.2, 2.16);
        var s = 0.4 + 0.6 * (d.t / d.wait);
        d.mesh.scale.set(s, s * 1.4, s);
        return;
      }
      var f = d.t - d.wait;
      var y = 2.2 - 0.5 * 9.8 * f * f;
      d.mesh.scale.set(1, 2.4, 1);
      if (y <= SW) { ripple(d.x, SW, 2.2, 0.2); d.t = -0.2 - R() * 0.6; d.wait = 0.5 + R() * 1.2; d.mesh.visible = false; return; }
      d.mesh.position.y = y;
    });

    // 自动门：每 12 秒开合一次
    var ph = (t + 4) % 12;
    var open = ph < 0.9 ? smooth(ph / 0.9) : ph < 3.4 ? 1 : ph < 4.3 ? 1 - smooth((ph - 3.4) / 0.9) : 0;
    doorL.position.x = -0.11 - 0.72 * open;
    doorR.position.x = 0.61 + 0.72 * open;
    spill.intensity = 0.45 + 0.3 * open;

    // 招牌闪烁
    if (t > flickAt) { flickEnd = t + 0.45 + R() * 0.3; flickAt = t + 7 + R() * 9; }
    var kSign = 0.97 + 0.03 * Math.sin(t * 13.0);
    if (t < flickEnd) kSign = Math.sin(t * 95) > 0.15 ? 1 : 0.4;
    signMat.color.setScalar(kSign * 0.78);
    signGlows.forEach(function (g) { g.material.opacity = g.userData.base * kSign; });
    signStreak.material.uniforms.uInt.value = signStreak.userData.base * kSign;
    if (t > pyFlickAt) { pyFlickEnd = t + 0.25 + R() * 0.25; pyFlickAt = t + 11 + R() * 10; }
    var kPy = t < pyFlickEnd ? (Math.sin(t * 120) > 0 ? 1 : 0.5) : 1;
    pylonMat.color.setScalar(kPy * 0.82);
    pylonGlows.forEach(function (g) { g.material.opacity = g.userData.base * kPy; });
    pylonStreak.material.uniforms.uInt.value = pylonStreak.userData.base * kPy;
    lightBoxMat.color.setScalar(0.94 + 0.06 * Math.sin(t * 2.3) * Math.sin(t * 7.1));
    vGlows.forEach(function (g, n) { g.material.opacity = g.userData.base * (0.92 + 0.08 * Math.sin(t * 3.1 + n * 2.0)); });
    alleyGlow.material.opacity = alleyGlow.userData.base * (0.9 + 0.1 * Math.sin(t * 5.3));

    // 电视的蓝光
    var tv = 0.55 + 0.25 * Math.sin(t * 7.0) * Math.sin(t * 2.3) + 0.2 * Math.sin(t * 17.0);
    tvMat.color.setRGB(0.35 * tv, 0.55 * tv, 1.0 * tv);
    tvGlow.material.opacity = 0.18 + 0.18 * tv;

    // 信号灯：16 秒一个周期
    var c = t % 16, onB, onA;
    if (c < 7) { onB = "g"; onA = "r"; } else if (c < 9.5) { onB = "y"; onA = "r"; } else if (c < 14) { onB = "r"; onA = "g"; } else { onB = "r"; onA = "y"; }
    setLamp(sigB, onB); setLamp(sigA, onA);
    sigGlowB.position.copy(sigB[onB].world).x -= 0.1;
    sigGlowB.material.color.setHex(lampColors[onB]);
    sigGlowA.position.copy(sigA[onA].world).z -= 0.1;
    sigGlowA.material.color.setHex(lampColors[onA]);
    sigStreak.material.uniforms.uColor.value.setHex(lampColors[onB]);
    lightCol[7].setHex(lampColors[onB]).multiplyScalar(1.3);
    var pedGo = c >= 9.5 && c < 14 && !(c > 12.6 && Math.sin(t * 16) < 0);
    pedR.material.color.setHex(pedGo ? 0x331111 : 0xff4a4a);
    pedG.material.color.setHex(pedGo ? 0x3ee6d0 : 0x112233);
    pedGlow.position.set(0.55, pedGo ? 2.38 : 2.66, 6.42);
    pedGlow.material.color.setHex(pedGo ? 0x3ee6d0 : 0xff4a4a);

    // 关东煮蒸汽
    steam.forEach(function (s) {
      s.t = (s.t + dt / 3.2) % 1;
      s.s.position.set(0.5 + Math.sin(s.t * 6 + s.s.id) * 0.06, FL + 1.25 + s.t * 0.7, -0.6 + Math.cos(s.t * 5 + s.s.id) * 0.05);
      var sz = 0.12 + s.t * 0.35;
      s.s.scale.set(sz, sz, 1);
      s.s.material.opacity = Math.sin(Math.PI * s.t) * 0.16;
    });
  }

  /* ---------- 循环 ---------- */
  var clock = new THREE.Clock();
  var pageVisible = !document.hidden, inView = true;
  document.addEventListener("visibilitychange", function () { pageVisible = !document.hidden; clock.getDelta(); });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (e) { inView = e[0].isIntersecting; clock.getDelta(); }).observe(renderer.domElement);
  }
  function loop() {
    requestAnimationFrame(loop);
    var dt = Math.min(clock.getDelta(), 0.05);
    if (!(pageVisible && inView)) return;
    clockTime += dt;
    if (idleSince > 0 && !REDUCE && clockTime - idleSince > 20) { controls.autoRotate = true; idleSince = 0; }
    var tg = controls.target;
    tg.x = Math.max(-6, Math.min(6, tg.x)); tg.y = Math.max(0.3, Math.min(4.5, tg.y)); tg.z = Math.max(-6, Math.min(6, tg.z));
    controls.update();
    update(clockTime, REDUCE ? dt * 0.5 : dt);
    render();
  }
  addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    makeTargets();
    splashes.material.uniforms.uScale.value = innerHeight * DPR * 0.5;
  });
  update(0, 0.016);
  loop();
})();
</script>
</body>
