<div class="container-lg">
  <header class="page-head">
    <div>
      <h1 class="page-title">搜索</h1>
      <p class="page-subtitle">在全部文章的标题、标签和正文中搜索</p>
    </div>
  </header>

  <div class="search-box">
    {% include icon.html name="search" %}
    <label class="sr-only" for="search-q">搜索关键词</label>
    <input class="form-control" id="search-q" type="search" placeholder="输入关键词…" autocomplete="off" data-search-input data-search-index="{{ '/search.json' | relative_url }}">
  </div>
  <p class="search-status" data-search-status role="status" aria-live="polite"></p>
  <ul class="post-list" data-search-results></ul>
</div>
