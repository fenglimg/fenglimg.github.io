# ------------------------------------------------------------
#  Bento Blog — 站点配置
#  改完这个文件后需要重启 `jekyll serve` 才会生效
# ------------------------------------------------------------

title: 我的博客
description: 记录代码、工具与日常思考。
lang: zh-CN
timezone: Asia/Shanghai

# 部署地址
# 用户/组织主页（username.github.io）：baseurl 留空
# 项目主页（username.github.io/repo）：baseurl 写成 "/repo"
url: "https://fenglimg.github.io"
baseurl: ""

# 作者信息：首页左侧个人卡片
author:
  name: Your Name
  username: fenglimg          # 显示成 GitHub 用户名的样子
  avatar: /assets/img/avatar.svg   # 也可以用 https://github.com/<你的用户名>.png
  bio: 写代码，也写字。关注 Web、工具链与开发者体验。
  location: Shanghai, China
  email: you@example.com
  website: ""

github_username: fenglimg

# 博客仓库，用于文章页的「在 GitHub 上编辑」链接，例如 yourname/yourname.github.io
repository: "fenglimg/fenglimg.github.io"
branch: main

# 首页「最近文章」卡片显示数量
home_posts: 5

# 首页「正在做」卡片
now:
  - 折腾静态站点与设计系统
  - 学习 Rust 与 WebAssembly
  - 每月至少写一篇博客

# 首页「语录」卡片
quote:
  text: 简单是可靠的先决条件。
  author: Edsger W. Dijkstra

# 每分钟阅读字数（用于估算阅读时长）
reading_speed: 400

# 评论：基于 GitHub Discussions 的 giscus（https://giscus.app 生成以下参数）
# 全部填好后文章页底部自动出现评论区
giscus:
  repo: ""
  repo_id: ""
  category: ""
  category_id: ""

# 顶部导航
nav:
  - title: 首页
    url: /
  - title: 文章
    url: /archive/
  - title: 标签
    url: /tags/
  - title: 关于
    url: /about/

permalink: /posts/:year/:month/:title/

# 默认布局：写文章时不用再手动指定 layout
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - LICENSE
